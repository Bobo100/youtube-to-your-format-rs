[package]
name = "ytf-core"
version = "2.0.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["process", "io-util", "fs", "sync", "time", "macros", "rt"] }
# native-tls = Windows SChannel; the default rustls/aws-lc needs cmake + nasm on windows-gnu
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "http2", "charset", "system-proxy", "json"] }
sha2 = "0.11.0"
hex = "0.4.3"
thiserror = "2.0.21"
futures-util = "0.3.34"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.23.0", default-features = false }
tempfile = "3.27.0"
url = "2.5.8"
tokio-util = "0.7.19"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_System_Com"] }


