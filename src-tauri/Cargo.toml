[workspace]
members = ["core"]

[package]
name = "youtube-to-your-format"
version = "2.0.0-rc.3"
description = "給長輩用的 YouTube 下載 / 轉檔程式"
authors = ["Bobo100"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ytf_lib"
# cdylib/staticlib are only for mobile targets; on windows-gnu a cdylib hits
# ld's 65535 export-ordinal limit ("export ordinal too large").
crate-type = ["rlib"]
# Tests live in `core/`. A Tauri-linked test exe dies with STATUS_ENTRYPOINT_NOT_FOUND
# because it lacks the app manifest, so this crate builds no test targets.
test = false
doctest = false

[[bin]]
name = "youtube-to-your-format"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["sync", "time"] }
ytf-core = { path = "core" }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
